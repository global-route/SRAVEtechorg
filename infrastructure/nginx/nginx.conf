upstream core_api       { server srave-api:8080; }
upstream spatial        { server spatial-ingestion:8001; }
upstream billing        { server billing-service:8002; }
upstream multilateral   { server multilateral-api:8003; }

server {
    listen 443 ssl;
    server_name api.srave.io;

    ssl_certificate     /etc/ssl/certs/srave.crt;
    ssl_certificate_key /etc/ssl/private/srave.key;
    ssl_protocols       TLSv1.3;

    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    location /api/v1/spatial/  { proxy_pass http://spatial; }
    location /api/v1/billing/  { proxy_pass http://billing; }
    location /api/v1/multilateral/ { proxy_pass http://multilateral; }
    location /api/v1/          { proxy_pass http://core_api; }

    location /health { proxy_pass http://core_api; }
}

server {
    listen 80;
    server_name api.srave.io;
    return 301 https://$host$request_uri;
}
