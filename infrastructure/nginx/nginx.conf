upstream srave_api        { server srave-api:8080; }
upstream spatial_worker   { server spatial-worker:8001; }
upstream billing_worker   { server billing-worker:8002; }
upstream multilateral     { server multilateral-api:8003; }
upstream voice_service    { server voice-service:8004; }

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

server {
    listen 443 ssl;
    server_name api.srave.io;

    ssl_certificate     /etc/ssl/certs/srave.crt;
    ssl_certificate_key /etc/ssl/private/srave.key;
    ssl_protocols       TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    limit_req zone=api_limit burst=20 nodelay;

    location /api/v1/multilateral/ { proxy_pass http://multilateral; }
    location /api/v1/billing/      { proxy_pass http://billing_worker; }
    location /api/v1/spatial/      { proxy_pass http://spatial_worker; }
    location /voice/               { proxy_pass http://voice_service; }
    location /                     { proxy_pass http://srave_api; }
}

server {
    listen 80;
    server_name api.srave.io;
    return 301 https://$host$request_uri;
}
