upstream srave_api      { server srave-api:8080; }
upstream spatial_worker { server spatial-worker:8001; }
upstream billing_worker { server billing-worker:8002; }
upstream multilateral   { server multilateral-api:8003; }
upstream voice_service  { server voice-service:8004; }
upstream dashboard      { server dashboard:3001; }

limit_req_zone $binary_remote_addr zone=ingest_limit:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=200r/m;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=500r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m    rate=10r/m;

server {
    listen 443 ssl;
    server_name api.srave.io;

    ssl_certificate     /etc/ssl/certs/srave.crt;
    ssl_certificate_key /etc/ssl/private/srave.key;
    ssl_protocols       TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # Ingest — expensive GEE + AI pipeline, strict limit
    location = /api/v1/spatial/ingest {
        limit_req zone=ingest_limit burst=5 nodelay;
        proxy_pass http://spatial_worker;
    }

    # Payment webhooks — high volume, permissive
    location ~ ^/api/v1/billing/webhook/ {
        limit_req zone=webhook_limit burst=50 nodelay;
        proxy_pass http://billing_worker;
    }

    # Multilateral — public, no auth, moderate
    location /api/v1/multilateral/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://multilateral;
    }

    # Spatial status polling
    location /api/v1/spatial/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://spatial_worker;
    }

    # Billing
    location /api/v1/billing/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://billing_worker;
    }

    # Voice
    location /voice/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://voice_service;
    }

    # Dashboard
    location /dashboard/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://dashboard/;
    }

    # Auth token endpoints — strict to prevent credential stuffing
    location ~ ^/api/v1/auth/(token|refresh)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://srave_api;
    }

    # Everything else → srave-api
    location / {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://srave_api;
    }
}

server {
    listen 80;
    server_name api.srave.io;
    return 301 https://$host$request_uri;
}
