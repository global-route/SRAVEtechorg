apiVersion: apps/v1
kind: Deployment
metadata:
  name: srave-core-api
  namespace: srave
spec:
  replicas: 2
  selector:
    matchLabels:
      app: srave-core-api
  template:
    metadata:
      labels:
        app: srave-core-api
    spec:
      containers:
        - name: srave-core-api
          image: ghcr.io/atlantic-tech/srave-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: srave-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: srave-api
  namespace: srave
spec:
  selector:
    app: srave-core-api
  ports:
    - port: 8080
      targetPort: 8080
