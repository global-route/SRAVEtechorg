apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: srave-api-hpa
  namespace: srave
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: srave-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spatial-worker-hpa
  namespace: srave
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spatial-worker
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
