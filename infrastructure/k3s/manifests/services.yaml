kind: Service
metadata:
  name: voice-service
  namespace: srave
spec:
  selector: { app: voice-service }
  ports: [{ port: 8004, targetPort: 8004 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: srave
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard }
  template:
    metadata:
      labels: { app: dashboard }
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/atlantic-tech/srave-dashboard:latest
          ports: [{ containerPort: 3001 }]
          env:
            - { name: API_BASE_URL, value: "http://srave-api:8080" }
          envFrom: [{ secretRef: { name: srave-secrets } }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          livenessProbe:
            httpGet: { path: /, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: srave
spec:
  selector: { app: dashboard }
  ports: [{ port: 3001, targetPort: 3001 }]
