apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-service
  namespace: srave
spec:
  replicas: 1
  selector:
    matchLabels: { app: voice-service }
  template:
    metadata:
      labels: { app: voice-service }
    spec:
      containers:
        - name: voice-service
          image: ghcr.io/atlantic-tech/srave-voice:latest
          ports: [{ containerPort: 8004 }]
          envFrom: [{ secretRef: { name: srave-secrets } }]
          env:
            - { name: DB_HOST, value: pgbouncer }
          volumeMounts: [{ name: voice-models, mountPath: /models }]
          resources:
            requests: { cpu: "200m", memory: "1Gi" }
            limits:   { cpu: "2000m", memory: "4Gi" }
          livenessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: voice-models
          persistentVolumeClaim: { claimName: srave-voice-models-pvc }
---
