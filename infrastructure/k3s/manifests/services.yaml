apiVersion: apps/v1
kind: Deployment
metadata:
  name: srave-api
  namespace: srave
spec:
  replicas: 2
  selector:
    matchLabels: { app: srave-api }
  template:
    metadata:
      labels: { app: srave-api }
    spec:
      containers:
        - name: srave-api
          image: ghcr.io/atlantic-tech/srave-api:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: srave-secrets } }]
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: srave-api
  namespace: srave
spec:
  selector: { app: srave-api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spatial-worker
  namespace: srave
spec:
  replicas: 1
  selector:
    matchLabels: { app: spatial-worker }
  template:
    metadata:
      labels: { app: spatial-worker }
    spec:
      containers:
        - name: spatial-worker
          image: ghcr.io/atlantic-tech/srave-spatial:latest
          ports: [{ containerPort: 8001 }]
          envFrom: [{ secretRef: { name: srave-secrets } }]
          volumeMounts: [{ name: model-weights, mountPath: /models }]
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 30
            periodSeconds: 60
      volumes:
        - name: model-weights
          persistentVolumeClaim: { claimName: srave-model-weights-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: spatial-worker
  namespace: srave
spec:
  selector: { app: spatial-worker }
  ports: [{ port: 8001, targetPort: 8001 }]
---
