apiVersion: apps/v1
kind: Deployment
metadata:
  name: srave-api
  namespace: srave
spec:
  replicas: 2
  selector:
    matchLabels: { app: srave-api }
  template:
    metadata:
      labels: { app: srave-api }
    spec:
      containers:
        - name: srave-api
          image: ghcr.io/atlantic-tech/srave-api:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: srave-secrets } }]
          env:
            - { name: DB_HOST, value: pgbouncer }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: srave-api
  namespace: srave
spec:
  selector: { app: srave-api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spatial-worker
  namespace: srave
spec:
  replicas: 1
  selector:
    matchLabels: { app: spatial-worker }
  template:
    metadata:
      labels: { app: spatial-worker }
    spec:
      containers:
        - name: spatial-worker
          image: ghcr.io/atlantic-tech/srave-spatial:latest
          ports: [{ containerPort: 8001 }]
          envFrom: [{ secretRef: { name: srave-secrets } }]
          env:
            - { name: DB_HOST, value: pgbouncer }
          volumeMounts: [{ name: model-weights, mountPath: /models }]
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "2Gi" }
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: model-weights
          persistentVolumeClaim: { claimName: srave-model-weights-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: spatial-worker
  namespace: srave
spec:
  selector: { app: spatial-worker }
  ports: [{ port: 8001, targetPort: 8001 }]
---
