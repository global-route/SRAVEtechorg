# Per-state stack template.
# Deploy with: kubectl apply -n srave-${STATE} -f state-stack.yaml
# Requires: STATE env var set, secrets pre-created in the namespace.
#
# Each state namespace gets:
#   - Its own Postgres + PostGIS PVC
#   - Its own Redis PVC
#   - Its own PgBouncer
#   - srave-api, spatial-worker, billing-worker, voice-service
#   - Ingress routing: ${STATE}.api.srave.io

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-weights
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:15-3.3
          envFrom:
            - secretRef:
                name: srave-db-secret
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "srave_user", "-d", "srave_prod"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 600Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: srave-state-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "${STATE}.api.srave.io"
      secretName: srave-${STATE}-tls
  rules:
    - host: "${STATE}.api.srave.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: srave-api
                port:
                  number: 8080
