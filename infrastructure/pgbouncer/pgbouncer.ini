[databases]
srave_prod = host=postgres-db port=5432 dbname=srave_prod

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3

server_idle_timeout = 600
client_idle_timeout = 0

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

# Health check
server_check_query = SELECT 1
server_check_delay = 30
