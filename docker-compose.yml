version: "3.8"

services:
  srave-api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports: ["8080:8080"]
    env_file: .env
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    restart: unless-stopped

  spatial-worker:
    build:
      context: .
      dockerfile: services/spatial-worker/Dockerfile
    ports: ["8001:8001"]
    env_file: .env
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    volumes: [srave-model-weights:/models]
    restart: unless-stopped

  spatial-celery:
    build:
      context: .
      dockerfile: services/spatial-worker/Dockerfile
    command: celery -A ingestion.tasks.celery_app worker --loglevel=info -Q celery --concurrency=2
    env_file: .env
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    volumes: [srave-model-weights:/models]
    restart: unless-stopped

  billing-worker:
    build:
      context: .
      dockerfile: services/billing-worker/Dockerfile
    ports: ["8002:8002"]
    env_file: .env
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    restart: unless-stopped

  billing-celery:
    build:
      context: .
      dockerfile: services/billing-worker/Dockerfile
    command: celery -A routers.assess worker --loglevel=info --concurrency=2
    env_file: .env
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    restart: unless-stopped

  multilateral-api:
    build:
      context: .
      dockerfile: services/multilateral-api/Dockerfile
    ports: ["8003:8003"]
    env_file: .env
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

  voice-service:
    build:
      context: .
      dockerfile: services/voice-service/Dockerfile
    ports: ["8004:8004"]
    env_file: .env
    depends_on:
      postgres-db:
        condition: service_healthy
      billing-worker:
        condition: service_started
    volumes: [srave-voice-models:/models]
    restart: unless-stopped

  postgres-db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: srave_prod
      POSTGRES_USER: srave_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srave_user -d srave_prod"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  srave-model-weights:
  srave-voice-models:
