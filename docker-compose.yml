version: "3.8"

services:
  srave-api:
    build: ./services/api
    ports: ["8080:8080"]
    env_file: .env
    depends_on: [postgres-db, redis-cache]
    restart: unless-stopped

  spatial-worker:
    build: ./services/spatial-worker
    ports: ["8001:8001"]
    env_file: .env
    depends_on: [postgres-db, redis-cache]
    volumes: [srave-model-weights:/models]
    restart: unless-stopped

  billing-worker:
    build: ./services/billing-worker
    ports: ["8002:8002"]
    env_file: .env
    depends_on: [postgres-db]
    restart: unless-stopped

  multilateral-api:
    build: ./services/multilateral-api
    ports: ["8003:8003"]
    env_file: .env
    depends_on: [postgres-db]
    restart: unless-stopped

  voice-service:
    build: ./services/voice-service
    ports: ["8004:8004"]
    env_file: .env
    depends_on: [billing-worker]
    volumes: [srave-voice-models:/models]
    restart: unless-stopped

  postgres-db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: srave_prod
      POSTGRES_USER: srave_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped

volumes:
  pgdata:
  srave-model-weights:
  srave-voice-models:
