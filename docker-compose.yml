version: "3.8"

services:
  srave-api:
    build: ./services/core-api
    ports: ["8080:8080"]
    env_file: .env
    depends_on: [postgres-db, redis-cache]
    restart: unless-stopped

  spatial-ingestion:
    build: ./services/spatial-ingestion
    ports: ["8001:8001"]
    env_file: .env
    depends_on: [postgres-db, redis-cache]
    restart: unless-stopped

  billing-service:
    build: ./services/billing-service
    ports: ["8002:8002"]
    env_file: .env
    depends_on: [postgres-db]
    restart: unless-stopped

  multilateral-api:
    build: ./services/multilateral-api
    ports: ["8003:8003"]
    env_file: .env
    depends_on: [postgres-db]
    restart: unless-stopped

  postgres-db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: srave_prod
      POSTGRES_USER: srave_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped

volumes:
  pgdata:
