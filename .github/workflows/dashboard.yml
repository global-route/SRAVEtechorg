name: Dashboard CI

on:
  push:
    branches: [main]
    paths: ["services/dashboard/**"]
  pull_request:
    paths: ["services/dashboard/**"]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/dashboard/package.json
      - run: npm ci
        working-directory: services/dashboard
      - run: npm run lint
        working-directory: services/dashboard
      - run: npm run build
        working-directory: services/dashboard

  push-image:
    runs-on: ubuntu-latest
    needs: lint-build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/dashboard
          push: true
          tags: ghcr.io/atlantic-tech/srave-dashboard:latest
      - name: Trigger Coolify deploy
        run: curl -s -X POST ${{ secrets.COOLIFY_WEBHOOK_DASHBOARD }}
