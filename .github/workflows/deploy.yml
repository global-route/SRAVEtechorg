name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            image: srave-api
            webhook_secret: COOLIFY_WEBHOOK_API
          - service: spatial-worker
            image: srave-spatial
            webhook_secret: COOLIFY_WEBHOOK_SPATIAL
          - service: billing-worker
            image: srave-billing
            webhook_secret: COOLIFY_WEBHOOK_BILLING
          - service: multilateral-api
            image: srave-multilateral
            webhook_secret: COOLIFY_WEBHOOK_MULTILATERAL
          - service: voice-service
            image: srave-voice
            webhook_secret: COOLIFY_WEBHOOK_VOICE

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/atlantic-tech/${{ matrix.image }}:latest

      - name: Trigger Coolify deploy
        run: curl -s -X POST ${{ secrets[matrix.webhook_secret] }}
