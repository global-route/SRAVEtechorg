name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check services/api services/spatial-worker services/billing-worker services/multilateral-api services/voice-service

  test-api:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/api
    env:
      JWT_SECRET: test_secret
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: srave_test
      DB_USER: srave_user
      DB_PASSWORD: testpassword
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: srave_test
          POSTGRES_USER: srave_user
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ../../requirements-base.txt pytest pytest-asyncio httpx python-jose[cryptography]
      - run: pytest tests -v --tb=short

  test-spatial-worker:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/spatial-worker
    env:
      REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ../../requirements-base.txt pytest pytest-asyncio celery
      - run: pytest tests -v --tb=short

  test-billing-worker:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/billing-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ../../requirements-base.txt pytest pytest-asyncio asyncpg celery
      - run: pytest tests -v --tb=short

  test-multilateral-api:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/multilateral-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ../../requirements-base.txt pytest pytest-asyncio
      - run: pytest tests -v --tb=short

  test-flutter:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/field-agent-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
      - run: flutter pub get
      - run: flutter test --coverage
