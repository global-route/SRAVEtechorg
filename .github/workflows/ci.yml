name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core-api, billing-service, multilateral-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/${{ matrix.service }}

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff && ruff check services/spatial-ingestion

  test-go:
    runs-on: ubuntu-latest
    needs: lint-go
    strategy:
      matrix:
        service: [core-api, billing-service, multilateral-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
        working-directory: services/${{ matrix.service }}
