name: srave_field_agent
description: SRAVE offline-first field agent app for property ground-truthing.
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.0
  mapbox_gl: ^0.16.0
  camera: ^0.10.5
  geolocator: ^11.0.0
  flutter_secure_storage: ^9.0.0
  tflite_flutter: ^0.10.4
  image: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  http: ^1.2.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
